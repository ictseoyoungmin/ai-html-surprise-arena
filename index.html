<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI HTML Surprise Arena 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');
        
        body {
            font-family: 'Inter', system-ui, sans-serif;
        }
        .title-font {
            font-family: 'Space Grotesk', sans-serif;
        }
        
        .card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card:hover {
            transform: translateY(-12px) scale(1.02);
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.4);
        }

        .preview-frame {
            width: 100%;
            height: 100%;
            border: 0;
            pointer-events: none;
            background: #000;
        }

        .preview-scrim {
            background:
                linear-gradient(to bottom, rgba(0, 0, 0, 0.75), transparent 34%, transparent 56%, rgba(0, 0, 0, 0.88)),
                radial-gradient(circle at 50% 45%, transparent, rgba(0, 0, 0, 0.28));
        }

        body.modal-open {
            overflow: hidden;
        }
        
        .demo-modal {
            animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .particle-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 50% 30%, rgba(59, 130, 246, 0.15), transparent 60%);
        }
    </style>
</head>
<body class="bg-zinc-950 text-white overflow-x-hidden">
    <div class="particle-bg"></div>
    
    <!-- Hero -->
    <header class="relative min-h-screen flex items-center justify-center border-b border-white/10">
        <div class="max-w-5xl mx-auto px-6 text-center pt-20">
            <div class="inline-flex items-center gap-2 bg-white/5 backdrop-blur-md px-6 py-2 rounded-full mb-8 border border-white/10">
                <span class="text-emerald-400">●</span>
                <span class="font-mono text-sm tracking-widest">AI CREATIVE BATTLE 2026</span>
            </div>
            
            <h1 class="title-font text-7xl md:text-8xl font-bold tracking-tighter leading-none mb-6">
                AI가 만든<br>
                <span class="bg-clip-text text-transparent bg-gradient-to-r from-blue-400 via-purple-400 to-pink-400">한 방 HTML</span>
            </h1>
            
            <p class="text-2xl text-zinc-400 max-w-2xl mx-auto mb-12">
                같은 프롬프트로 Grok, ChatGPT, Claude, Gemini 등이 만든<br>
                가장 간결하면서도 놀라운 단일 파일 웹페이지들
            </p>
            
            <div class="flex flex-wrap justify-center gap-4 text-sm">
                <div class="bg-white/5 px-5 py-2.5 rounded-2xl flex items-center gap-2">
                    <i class="fa-solid fa-bolt text-yellow-400"></i>
                    <span id="demo-count">데모 로딩 중</span>
                </div>
                <div class="bg-white/5 px-5 py-2.5 rounded-2xl flex items-center gap-2">
                    <i class="fa-solid fa-file-code text-blue-400"></i>
                    <span>단일 HTML</span>
                </div>
                <div class="bg-white/5 px-5 py-2.5 rounded-2xl flex items-center gap-2">
                    <i class="fa-solid fa-fire text-red-400"></i>
                    <span>실시간 인터랙션</span>
                </div>
            </div>
            
            <button onclick="document.getElementById('demos').scrollIntoView({behavior: 'smooth'})" 
                    class="mt-16 px-10 py-5 bg-white text-black font-semibold rounded-3xl hover:bg-white/90 transition-all flex items-center gap-3 mx-auto group text-lg">
                모든 데모 보기
                <span class="group-hover:rotate-12 transition-transform">↓</span>
            </button>
        </div>
        
        <div class="absolute bottom-12 left-1/2 -translate-x-1/2 text-zinc-500 text-xs tracking-widest flex gap-8 font-mono">
            <div>SCROLL TO EXPLORE</div>
        </div>
    </header>

    <!-- Demos Section -->
    <section id="demos" class="max-w-7xl mx-auto px-6 py-24">
        <div class="flex justify-between items-end mb-12">
            <div>
                <h2 class="text-5xl font-bold title-font tracking-tight">All Creations</h2>
                <p class="text-zinc-400 mt-3">클릭해서 풀스크린으로 체험하세요</p>
            </div>
            
            <div class="flex flex-wrap justify-end gap-3">
                <button data-filter="all" 
                        class="active-filter px-6 py-3 rounded-2xl text-sm font-medium bg-white/10 hover:bg-white/20 transition-colors" id="filter-all">
                    ALL
                </button>
                <button data-filter="claude" 
                        class="px-6 py-3 rounded-2xl text-sm font-medium hover:bg-white/10 transition-colors" id="filter-claude">
                    CLAUDE
                </button>
                <button data-filter="chatgpt" 
                        class="px-6 py-3 rounded-2xl text-sm font-medium hover:bg-white/10 transition-colors" id="filter-chatgpt">
                    CHATGPT
                </button>
                <button data-filter="grok" 
                        class="px-6 py-3 rounded-2xl text-sm font-medium hover:bg-white/10 transition-colors" id="filter-grok">
                    GROK
                </button>
                <button data-filter="gemini" 
                        class="px-6 py-3 rounded-2xl text-sm font-medium hover:bg-white/10 transition-colors" id="filter-gemini">
                    GEMINI
                </button>
                <button data-filter="mai" 
                        class="px-6 py-3 rounded-2xl text-sm font-medium hover:bg-white/10 transition-colors" id="filter-mai">
                    MAI
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="demo-grid">
            <div class="col-span-full text-zinc-500 font-mono">Loading evaluation data...</div>
        </div>
    </section>

    <!-- Modal -->
    <div id="modal" class="hidden fixed inset-0 bg-black z-50">
        <div id="modal-shell" class="demo-modal bg-black w-screen h-screen overflow-hidden">
            <!-- Modal Header -->
            <div class="absolute left-0 right-0 top-0 z-10 flex items-center justify-between gap-4 p-4 md:p-5 bg-gradient-to-b from-black/85 to-transparent">
                <div class="flex min-w-0 items-center gap-4 rounded-2xl bg-black/55 px-4 py-3 backdrop-blur-md ring-1 ring-white/10">
                    <div id="modal-model" class="font-mono text-sm"></div>
                    <div id="modal-title" class="truncate text-lg md:text-xl font-semibold"></div>
                </div>
                <div class="flex items-center gap-2 rounded-2xl bg-black/55 p-2 backdrop-blur-md ring-1 ring-white/10">
                    <button onclick="enterFullscreen()" 
                            class="h-10 w-10 text-zinc-300 hover:text-white" title="브라우저 전체화면">
                        <i class="fa-solid fa-expand"></i>
                    </button>
                    <a id="modal-open-tab" href="#" target="_blank" 
                       class="grid h-10 w-10 place-items-center text-zinc-300 hover:text-white" title="새 탭에서 열기">
                        <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    </a>
                    <button onclick="closeModal()" 
                            class="h-10 w-10 text-zinc-300 hover:text-white" title="닫기">
                        <i class="fa-solid fa-xmark text-2xl"></i>
                    </button>
                </div>
            </div>
            
            <!-- Iframe -->
            <div class="absolute inset-0 bg-black" id="modal-content">
                <iframe id="demo-iframe" class="h-full w-full" frameborder="0" allowfullscreen></iframe>
            </div>
            
            <div class="absolute bottom-0 left-0 right-0 z-10 flex items-center justify-between gap-4 bg-gradient-to-t from-black/85 to-transparent p-4 text-xs text-zinc-400 font-mono">
                <div id="modal-desc" class="min-w-0 truncate rounded-2xl bg-black/55 px-4 py-3 backdrop-blur-md ring-1 ring-white/10"></div>
                <a id="modal-source" href="#" target="_blank" class="flex shrink-0 items-center gap-2 rounded-2xl bg-black/55 px-4 py-3 backdrop-blur-md ring-1 ring-white/10 hover:text-white">
                    <i class="fa-solid fa-code"></i>
                    <span>소스 보기</span>
                </a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-black border-t border-white/10 py-16">
        <div class="max-w-5xl mx-auto px-6 text-center">
            <p class="text-zinc-500 mb-6">Made with curiosity • 2026</p>
            <div class="flex justify-center gap-8 text-sm text-zinc-400">
                <a href="https://github.com/YOUR-USERNAME/ai-html-surprise-arena" class="hover:text-white transition-colors flex items-center gap-2">
                    <i class="fa-brands fa-github"></i> GitHub Repo
                </a>
                <span>·</span>
                <span id="prompt-copy">프롬프트 로딩 중</span>
            </div>
        </div>
    </footer>

    <script>
        let demos = [];
        let activeFilter = 'all';

        const familyStyles = {
            claude: { text: 'text-violet-300', ring: 'ring-violet-400/30', icon: '◼' },
            chatgpt: { text: 'text-emerald-300', ring: 'ring-emerald-400/30', icon: '✦' },
            grok: { text: 'text-blue-300', ring: 'ring-blue-400/30', icon: '✹' },
            gemini: { text: 'text-cyan-300', ring: 'ring-cyan-400/30', icon: '∞' },
            mai: { text: 'text-fuchsia-300', ring: 'ring-fuchsia-400/30', icon: '◉' }
        };

        function escapeHtml(value) {
            return String(value)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        function createCard(demo) {
            const style = familyStyles[demo.family] || familyStyles.chatgpt;
            const card = document.createElement('div');
            card.className = 'card group bg-zinc-900 border border-white/10 rounded-3xl overflow-hidden cursor-pointer';
            card.innerHTML = `
                <div class="aspect-video bg-black relative overflow-hidden">
                    <iframe class="preview-frame" src="${escapeHtml(demo.path)}" title="${escapeHtml(demo.title)} preview" loading="lazy" tabindex="-1"></iframe>
                    <div class="preview-scrim absolute inset-0"></div>
                    <div class="absolute left-4 top-4 bg-white text-black text-xs px-3 py-1 rounded-full font-bold">#${demo.rank}</div>
                    <div class="absolute right-4 top-4 bg-black/75 text-[10px] px-3 py-1 rounded-full font-mono tracking-widest ${style.text}">${escapeHtml(demo.model)}</div>
                    <div class="absolute bottom-4 left-4 right-4 flex items-end justify-between gap-4">
                        <div>
                            <div class="text-[10px] text-zinc-400 font-mono tracking-widest">PREVIEW</div>
                            <div class="text-2xl opacity-80">${style.icon}</div>
                        </div>
                        <div class="grid w-40 grid-cols-2 gap-2">
                            <div class="bg-black/65 backdrop-blur px-3 py-2 rounded-2xl ring-1 ${style.ring}">
                                <div class="text-[9px] text-zinc-500 font-mono">QUANT</div>
                                <div class="text-lg font-bold">${demo.quantitativeScore}</div>
                            </div>
                            <div class="bg-black/65 backdrop-blur px-3 py-2 rounded-2xl ring-1 ${style.ring}">
                                <div class="text-[9px] text-zinc-500 font-mono">HUMAN</div>
                                <div class="text-lg font-bold">${demo.subjectiveScore}</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="p-6">
                    <div class="font-semibold text-xl mb-2 title-font">${escapeHtml(demo.title)}</div>
                    <p class="text-zinc-400 text-sm line-clamp-2 mb-4">${escapeHtml(demo.summary)}</p>
                    <p class="text-zinc-500 text-xs mb-6">${escapeHtml(demo.topic)} · ${demo.lines} lines</p>
                    <div class="flex flex-wrap gap-2">
                        ${demo.tech.map(tag => `<span class="text-[10px] px-3 py-1 bg-white/5 rounded-full">${escapeHtml(tag)}</span>`).join('')}
                    </div>
                </div>
            `;
            card.onclick = () => openDemo(demo);
            return card;
        }

        function renderDemos(filteredDemos) {
            const grid = document.getElementById('demo-grid');
            grid.innerHTML = '';
            if (!filteredDemos.length) {
                grid.innerHTML = '<div class="col-span-full text-zinc-500 font-mono">No demos found.</div>';
                return;
            }
            filteredDemos.forEach(demo => {
                grid.appendChild(createCard(demo));
            });
        }

        function openDemo(demo) {
            const modal = document.getElementById('modal');
            const style = familyStyles[demo.family] || familyStyles.chatgpt;
            document.getElementById('modal-model').innerHTML = `<span class="${style.text}">#${demo.rank} ${escapeHtml(demo.model)}</span>`;
            document.getElementById('modal-title').textContent = demo.title;
            document.getElementById('modal-desc').textContent = `${demo.summary} · 정량 ${demo.quantitativeScore}/100 · 주관 ${demo.subjectiveScore}/10`;
            
            const iframe = document.getElementById('demo-iframe');
            iframe.src = demo.path;

            const source = document.getElementById('modal-source');
            source.href = demo.path;

            const openTab = document.getElementById('modal-open-tab');
            openTab.href = demo.path;
            
            modal.classList.remove('hidden');
            document.body.classList.add('modal-open');
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            const iframe = document.getElementById('demo-iframe');
            iframe.src = '';
            document.getElementById('modal-source').href = '#';
            document.getElementById('modal-open-tab').href = '#';
            modal.classList.add('hidden');
            document.body.classList.remove('modal-open');
            if (document.fullscreenElement && document.exitFullscreen) {
                document.exitFullscreen();
            }
        }

        function enterFullscreen() {
            const shell = document.getElementById('modal-shell');
            if (shell.requestFullscreen) {
                shell.requestFullscreen();
            }
        }

        function filterModels(model) {
            activeFilter = model;
            document.querySelectorAll('[id^="filter-"]').forEach(btn => {
                btn.classList.remove('active-filter', 'bg-white/10');
            });
            
            if (model === 'all') {
                document.getElementById('filter-all').classList.add('active-filter', 'bg-white/10');
                renderDemos(demos);
            } else {
                document.getElementById(`filter-${model}`).classList.add('active-filter', 'bg-white/10');
                const filtered = demos.filter(d => d.family === model);
                renderDemos(filtered);
            }
        }

        async function loadEvaluationData() {
            const response = await fetch('data/demos.json');
            if (!response.ok) {
                throw new Error(`Failed to load data/demos.json: ${response.status}`);
            }

            const data = await response.json();
            demos = [...data.demos].sort((a, b) => a.rank - b.rank);
            document.title = data.meta.title;
            document.getElementById('demo-count').textContent = `${demos.length}개 데모`;
            document.getElementById('prompt-copy').textContent = `프롬프트: "${data.meta.prompt}"`;
            filterModels(activeFilter);
        }

        function showLoadError(error) {
            const grid = document.getElementById('demo-grid');
            grid.innerHTML = `
                <div class="col-span-full border border-red-400/30 bg-red-950/20 rounded-3xl p-8">
                    <div class="text-red-300 font-semibold mb-2">평가 데이터를 불러오지 못했습니다.</div>
                    <p class="text-zinc-400 text-sm">로컬 파일을 직접 열었다면 브라우저 보안 정책 때문에 JSON 로드가 막힐 수 있습니다. 로컬 서버에서 열어 주세요.</p>
                    <p class="text-zinc-600 text-xs font-mono mt-4">${escapeHtml(error.message)}</p>
                </div>
            `;
        }

        // Initialize
        window.onload = () => {
            loadEvaluationData().catch(showLoadError);

            document.querySelectorAll('[data-filter]').forEach(btn => {
                btn.addEventListener('click', () => filterModels(btn.dataset.filter));
            });
            
            // Close modal on ESC
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeModal();
            });
            
            // Click outside modal to close
            const modal = document.getElementById('modal');
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });
        };
    </script>
</body>
</html>
