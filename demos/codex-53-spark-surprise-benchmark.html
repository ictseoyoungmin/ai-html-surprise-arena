<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>AI 성능 놀이터</title>
  <style>
    :root{
      --bg:#07090f;
      --panel:#0f1628cc;
      --line:#1f2a44;
      --text:#dbe4ff;
      --sub:#9aa8d1;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif,system-ui,Arial,sans-serif;
      color:var(--text);
      background:radial-gradient(900px circle at 20% 20%, #151f3b, transparent 45%), radial-gradient(1200px circle at 80% 0%, #1b2546, transparent 55%), var(--bg);
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      overflow:hidden;
    }
    .wrap{
      width:min(980px,100%);
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:16px;
      padding:24px;
      position:relative;
      box-shadow:0 0 40px rgba(95,129,255,.2);
      backdrop-filter:blur(4px);
    }
    h1{margin:0 0 6px;font-size:28px;letter-spacing:.02em}
    p{margin:0;color:var(--sub);line-height:1.5}
    .controls{display:grid;grid-template-columns:1fr auto;gap:10px;margin:16px 0 12px}
    textarea{
      width:100%;
      min-height:94px;
      resize:vertical;
      border-radius:12px;
      border:1px solid var(--line);
      background:#070b16;
      color:var(--text);
      padding:10px;
    }
    button{
      border:none;border-radius:12px;
      padding:12px 16px;
      background:#6c7bff;
      color:white;
      font-weight:600;
      cursor:pointer;
      align-self:flex-end;
    }
    button:hover{filter:brightness(1.08)}
    .status{height:24px;margin-bottom:12px;font-size:14px;color:#8fc7ff}
    .metrics{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
    .card{
      border:1px solid var(--line);
      border-radius:14px;
      padding:14px;
      background:#0b1121cc;
    }
    .title{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
    .score{font-size:24px;font-weight:700}
    .bars{margin-top:10px}
    .bar{height:8px;background:#0f1424;border-radius:999px;overflow:hidden;margin:7px 0 10px}
    .bar i{display:block;height:100%;width:0;border-radius:inherit}
    .muted{font-size:12px;color:var(--sub)}
    .result{
      margin-top:12px;
      padding:10px 12px;
      background:#08101f;
      border:1px dashed #2f4a83;
      border-radius:12px;
    }
    .canvas{
      margin-top:14px;
      border:1px solid var(--line);
      border-radius:14px;
      width:100%;
      aspect-ratio: 2.2 / 1;
      background:linear-gradient(180deg,#070b16,#0b101f);
    }
    @media (max-width:760px){
      .controls{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>AI 버전 대시보드 (정량 + 주관)</h1>
    <p>한 줄 과제를 입력하면 가상의 ChatGPT 버전들에 대한 정량 점수와 사람 주관 점수를 즉석 산출합니다.  
    점수는 입력 난이도, 구조성, 창의성 키워드에 의해 결정되어 “왜냐하면”을 보여 줍니다.</p>
    <div class="controls">
      <textarea id="prompt" placeholder="예: 한 문장으로 양자 역학을 쉽게 설명해 줘">이 문장을 5살도 이해할 수 있게 요약하고, 이어서 창의적으로 풍자적인 은유 3개로 다시 설명해 줘.</textarea>
      <button id="run">벤치마크 실행</button>
    </div>
    <div class="status" id="status">준비됨</div>
    <div class="metrics" id="cards"></div>
    <div class="result" id="summary">입력 후 시작하세요.</div>
    <canvas class="canvas" id="chart" width="1000" height="450"></canvas>
  </div>
  <script>
  const versions = [
    { key:'gpt-3.5', label:'GPT-3.5', color:'#7cc8ff', speed:0.65, stable:0.70, creative:0.55, safety:0.48 },
    { key:'gpt-4', label:'GPT-4', color:'#9f84ff', speed:0.72, stable:0.84, creative:0.86, safety:0.78 },
    { key:'gpt-4.1', label:'GPT-4.1', color:'#f57fef', speed:0.88, stable:0.92, creative:0.91, safety:0.85 },
    { key:'gemini', label:'Gemini-Flash', color:'#6cff95', speed:0.97, stable:0.73, creative:0.76, safety:0.66 }
  ];
  const promptEl = document.getElementById('prompt');
  const cards = document.getElementById('cards');
  const status = document.getElementById('status');
  const summary = document.getElementById('summary');
  const canvas = document.getElementById('chart');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr; canvas.height = rect.height * dpr; ctx.scale(dpr, dpr);
  const metrics = ['speed','stable','creative','safety'];
  let particles = [];
  let latestRows = [];

  function rgbaFromHex(hex, alpha){
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  function hash(str){
    let h=2166136261;
    for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h,16777619);}
    return (h>>>0)/4294967296;
  }
  function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }
  function scoreFeature(base, f, tag, scale=1){
    const complexity = clamp((f.len*18 + f.structure*22 + f.creative*16 + f.difficulty*20), 0, 36);
    const bias = (hash(tag) - 0.5) * 18;
    return clamp(Math.round(base*100 + complexity*scale + bias), 0, 100);
  }
  function infer(prompt){
    const p = prompt.toLowerCase();
    const len = clamp(p.length/40,0.3,1.8);
    const structure = (p.match(/[;,.!?]/g)||[]).length/8;
    const creative = (p.match(/비유|은유|창의|재미|그림|그림처럼|우주|음악|시|story|창작/g)||[]).length*0.08;
    const difficulty = (p.match(/수학|물리|논리|최적|설계|버그|병렬|통계|보안|암호|시뮬레/g)||[]).length*0.12;
    return {len,structure,creative,difficulty};
  }

  function run(){
    const p = promptEl.value.trim() || '안내를 요청합니다.';
    const f = infer(p);
    status.textContent = '점수 계산중…';
    cards.innerHTML='';
    particles = [];
    latestRows = [];
    const rows = [];

    versions.forEach((v,idx)=>{
      const weights = {
        speed:   0.38+f.len*0.09 + f.structure*0.03,
        stable:  0.45+f.difficulty*0.12,
        creative:0.55+f.creative*0.12,
        safety:  0.35+Math.max(0,1-f.creative)*0.1
      };
      const scores = {
        speed: scoreFeature(v.speed, f, v.key+v.label+'speed', weights.speed),
        stable:scoreFeature(v.stable, f, v.key+v.label+'stable', weights.stable),
        creative:scoreFeature(v.creative, f, v.key+v.label+'creative', weights.creative),
        safety:scoreFeature(v.safety, f, v.key+v.label+'safety', weights.safety),
      };
      const total = clamp(Math.round((scores.speed*0.3+scores.stable*0.25+scores.creative*0.3+scores.safety*0.15)), 0, 100);
      rows.push({...v,scores,total});

      const card = document.createElement('section');
      card.className='card';
      const title = document.createElement('div');
      title.className='title';
      title.innerHTML=`<b>${v.label}</b><span class="score">0 / 100</span>`;
      const bars=document.createElement('div');
      bars.className='bars';
      metrics.forEach(k=>{
        const label = document.createElement('div');label.className='muted';
        label.textContent = ({
          speed:'속도',stable:'안정성',creative:'창의성',safety:'안전성'
        })[k];
        const barWrap=document.createElement('div'); barWrap.className='bar';
        const bar=document.createElement('i'); bar.style.background=v.color; bar.style.width='0%';
        barWrap.appendChild(bar);
        bars.appendChild(label); bars.appendChild(barWrap);
        setTimeout(()=>{ bar.style.width = Math.round(scores[k]) + '%'; bar.style.transition='width 1.2s cubic-bezier(.2,.8,.2,1)'; },20+idx*30);
      });
      card.appendChild(title); card.appendChild(bars);
      cards.appendChild(card);
      animateScore(title.querySelector('.score'),total);

      for(let i=0;i<20;i++) spawnParticle(v);
    });

    rows.sort((a,b)=>b.total-a.total);
    latestRows = rows;
    const top = rows[0];
    const avg = Math.round(rows.reduce((s,r)=>s+r.total,0)/rows.length);
    const subjective = clamp(Math.round(70 + (top.total-65)*0.6), 20, 100);
    summary.innerHTML = `
      <b>요약</b> ${new Date().toLocaleTimeString()} 기준 <strong>${top.label}</strong> 우위(${top.total}점). 
      전체 정량 평균은 <strong>${avg}점</strong>이며, 사람 주관 체감은 <strong>${subjective}점</strong>입니다.
    `;
    status.textContent = '완료 — 클릭하면 값이 다시 계산됩니다.';
    requestAnimationFrame(drawChart);
  }

  function animateScore(el,target){
    let n=0; const step=()=>{n=Math.min(n+1,target); el.textContent = n+' / 100'; if(n<target)setTimeout(step,12);} ; step();
  }
  function spawnParticle(v){
    const w = canvas.clientWidth, h = canvas.clientHeight;
    const angle = Math.random()*Math.PI*2;
    const speed = Math.random()*1.8 + 0.4;
    particles.push({
      x:w/2 + (Math.random()-0.5)*120,
      y:h*0.6 + (Math.random()-0.5)*40,
      vx:Math.cos(angle)*speed*0.6, vy:Math.sin(angle)*speed*0.6 - Math.random()*1.8,
      life:Math.random()*180+80,
      max:1+Math.random()*2,
      color:v.color
    });
  }
  function drawChart(){
    ctx.clearRect(0,0,canvas.width/dpr,canvas.height/dpr);
    const w = canvas.clientWidth, h = canvas.clientHeight;
    ctx.fillStyle='#0a0f1c';
    ctx.fillRect(0,0,w,h);
    const cx = w*0.33, cy = h*0.62;
    const size = Math.min(w*0.18,h*0.24);
    const angleStep = (Math.PI*2)/metrics.length;
    const labels = ['속도','안정성','창의성','안전성'];

    // axes
    for(let i=0;i<4;i++){
      const a = i*angleStep-Math.PI*0.2;
      const x1 = cx + Math.cos(a)*size;
      const y1 = cy + Math.sin(a)*size;
      ctx.strokeStyle='#22304f'; ctx.beginPath();
      ctx.moveTo(cx,cy); ctx.lineTo(x1,y1); ctx.stroke();
      ctx.fillStyle='#9fb0d7'; ctx.font='12px sans-serif';
      ctx.fillText(labels[i], cx+Math.cos(a)*(size+14)-10, cy+Math.sin(a)*(size+10)+4);
    }

    for(let ring=1; ring<=5; ring++){
      const r = size * ring/5;
      ctx.beginPath();
      for(let i=0;i<=4;i++){
        const a = i*angleStep-Math.PI*0.2;
        const x=cx+Math.cos(a)*r, y=cy+Math.sin(a)*r;
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.strokeStyle='#1a2a46'; ctx.stroke();
    }

    latestRows.forEach((v,idx)=>{
      const total = v.total || 0;
      const base = total/100;
      const pts = [
        (v.scores?.speed||50)*base/100,
        (v.scores?.stable||50)*base/100,
        (v.scores?.creative||50)*base/100,
        (v.scores?.safety||50)*base/100
      ];
      ctx.strokeStyle = v.color;
      ctx.fillStyle = rgbaFromHex(v.color, 0.15);
      ctx.beginPath();
      pts.forEach((p,i)=>{
        const a = i*angleStep-Math.PI*0.2;
        const x = cx + Math.cos(a)*size*p;
        const y = cy + Math.sin(a)*size*p;
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      });
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.fillStyle='#fff';
      ctx.fillText(v.label, w*0.55 + (idx%2)*150, 26+idx*24);
      ctx.fillText(total, w*0.73 + (idx%2)*150, 26+idx*24);
    });

    // particles
    particles = particles.filter(p=>p.life>0);
    particles.forEach(p=>{
      p.x += p.vx; p.y += p.vy; p.vy += 0.008; p.life--;
      const alpha = Math.max(0, p.life/200);
      ctx.fillStyle = rgbaFromHex(p.color, alpha*0.85);
      ctx.beginPath();
      ctx.arc(p.x,p.y, p.max, 0, Math.PI*2);
      ctx.fill();
    });
    if(particles.length) requestAnimationFrame(drawChart);
  }
  document.getElementById('run').addEventListener('click', run);
  run();
  </script>
</body>
</html>
