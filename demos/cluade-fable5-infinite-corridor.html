<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>무한 회랑 — Infinite Corridor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;800&family=IBM+Plex+Mono:wght@300&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#e9f3f2; --dim:#7fa7a3; --glow:#6ef0d8;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#020507;overflow:hidden}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

  .frame{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;
    justify-content:space-between;padding:clamp(20px,4vw,52px);color:var(--ink)}

  .eyebrow{font:300 11px/1 'IBM Plex Mono',monospace;letter-spacing:.42em;color:var(--dim);
    text-transform:uppercase;animation:rise 1.6s .2s cubic-bezier(.2,.8,.2,1) both}
  h1{font:800 clamp(40px,7vw,92px)/1.05 'Nanum Myeongjo',serif;margin-top:14px;
    text-shadow:0 0 60px rgba(110,240,216,.25);animation:rise 1.6s .45s cubic-bezier(.2,.8,.2,1) both}
  h1 em{font-style:normal;color:var(--glow)}
  .sub{font:400 clamp(13px,1.4vw,16px)/1.7 'Nanum Myeongjo',serif;color:var(--dim);
    max-width:34em;margin-top:16px;animation:rise 1.6s .7s cubic-bezier(.2,.8,.2,1) both}

  .hud{display:flex;justify-content:space-between;align-items:flex-end;
    font:300 11px/1.8 'IBM Plex Mono',monospace;color:var(--dim);letter-spacing:.12em;
    animation:rise 1.6s 1s both}
  .hud b{color:var(--ink);font-weight:300}
  .hint{text-align:right}

  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="frame">
  <header>
    <div class="eyebrow">Realtime Raymarching · 0 Libraries · 1 File</div>
    <h1>무한 <em>회랑</em></h1>
    <p class="sub">지금 보고 계신 모든 구조물은 단 한 장의 사각형 위에서, 매 프레임 픽셀마다
    수백 번의 거리 계산으로 즉석에서 '발견'되는 프랙탈 공간입니다. 저장된 3D 모델은 없습니다.</p>
  </header>
  <footer class="hud">
    <div>FPS <b id="fps">—</b> &nbsp;·&nbsp; <b id="res">—</b> &nbsp;·&nbsp; <span id="rays">—</span> 거리계산/초</div>
    <div class="hint">마우스(터치)를 움직여 시선을 돌려보세요</div>
  </footer>
</div>

<script>
const cv = document.getElementById('c');
const gl = cv.getContext('webgl', {antialias:false, powerPreference:'high-performance'});

const FRAG = `
precision highp float;
uniform vec2 uRes; uniform float uT; uniform vec2 uM;

mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,-s,s,c); }

// 무한 타일링되는 아폴로니안 계열 프랙탈 거리함수
float map(vec3 p, out float trap){
  float k = 1.16 + 0.04*sin(uT*0.13);     // 시간에 따라 공간 자체가 숨쉰다
  float s = 1.0; trap = 1e9;
  for(int i=0;i<8;i++){
    p = -1.0 + 2.0*fract(0.5*p + 0.5);    // 공간을 무한 반복
    float r2 = dot(p,p);
    trap = min(trap, r2);
    float f = k/r2;
    p *= f; s *= f;
  }
  return 0.25*abs(p.y)/s;
}

vec3 normalAt(vec3 p){
  float t; vec2 e = vec2(0.0008,0.0);
  return normalize(vec3(
    map(p+e.xyy,t)-map(p-e.xyy,t),
    map(p+e.yxy,t)-map(p-e.yxy,t),
    map(p+e.yyx,t)-map(p-e.yyx,t)));
}

vec3 palette(float h){  // 심해 발광 팔레트
  return 0.5 + 0.5*cos(6.2831*(h + vec3(0.00,0.33,0.55)) );
}

void main(){
  vec2 uv = (2.0*gl_FragCoord.xy - uRes)/uRes.y;

  // 회랑을 따라 천천히 전진하는 카메라
  float t = uT*0.22;
  vec3 ro = vec3(0.5+0.35*sin(t*0.7), 1.0+0.15*sin(t*0.9), t);
  vec3 ww = normalize(vec3(0.35*cos(t*0.7), -0.1, 1.0));
  // 마우스 시선
  ww.xz *= rot((uM.x-0.5)*1.6);
  ww.yz *= rot((uM.y-0.5)*1.0);
  vec3 uu = normalize(cross(ww, vec3(0,1,0)));
  vec3 vv = cross(uu, ww);
  vec3 rd = normalize(uv.x*uu + uv.y*vv + 1.4*ww);

  float trap, d, dist = 0.0, glow = 0.0;
  vec3 p; float steps = 0.0;
  for(int i=0;i<110;i++){
    p = ro + rd*dist;
    d = map(p, trap);
    glow += exp(-d*55.0);                // 좁은 틈에서 새어 나오는 빛
    if(d < 0.0006 || dist > 24.0) break;
    dist += d*0.9; steps += 1.0;
  }

  vec3 col = vec3(0.0);
  if(dist < 24.0){
    vec3 n = normalAt(p);
    float ao  = clamp(1.0 - steps/110.0, 0.0, 1.0);          // 걸음수 기반 AO
    float fre = pow(1.0 - max(dot(-rd,n),0.0), 3.0);
    vec3 base = palette(0.6 + 0.25*log2(trap) + 0.03*p.z);
    float key = max(dot(n, normalize(vec3(0.4,0.8,-0.3))), 0.0);
    col = base*(0.12 + 0.9*key)*ao*ao;
    col += base*fre*0.8;                                     // 가장자리 발광
    col += palette(0.1+0.04*p.z)*glow*0.012;                 // 누적 글로우
  }
  // 깊이 안개 → 어둠 속으로
  col = mix(col, vec3(0.004,0.010,0.014), 1.0 - exp(-0.085*dist*dist*0.1));
  col = pow(col, vec3(0.4545));                              // 감마
  col *= 1.0 - 0.35*dot(uv*0.5,uv*0.5);                      // 비네트
  gl_FragColor = vec4(col, 1.0);
}`;

const VERT = 'attribute vec2 a; void main(){ gl_Position = vec4(a,0.,1.); }';

function sh(type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s);
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog); gl.useProgram(prog);

gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog,'a');
gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);

const uRes = gl.getUniformLocation(prog,'uRes'),
      uT   = gl.getUniformLocation(prog,'uT'),
      uM   = gl.getUniformLocation(prog,'uM');

let mx=.5, my=.5, tx=.5, ty=.5, dpr=Math.min(devicePixelRatio,1.75);
addEventListener('pointermove', e=>{ tx=e.clientX/innerWidth; ty=e.clientY/innerHeight; });

function resize(){
  cv.width = innerWidth*dpr; cv.height = innerHeight*dpr;
  gl.viewport(0,0,cv.width,cv.height);
  document.getElementById('res').textContent = cv.width+'×'+cv.height;
}
addEventListener('resize', resize); resize();

// FPS 측정 + 자동 해상도 조절(벤치마크용)
let frames=0, last=performance.now(), t0=last;
const fpsEl=document.getElementById('fps'), raysEl=document.getElementById('rays');

function loop(now){
  mx += (tx-mx)*0.05; my += (ty-my)*0.05;
  gl.uniform2f(uRes, cv.width, cv.height);
  gl.uniform1f(uT, (now-t0)/1000);
  gl.uniform2f(uM, mx, my);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  frames++;
  if(now-last > 1000){
    const fps = frames*1000/(now-last);
    fpsEl.textContent = fps.toFixed(0);
    // 픽셀수 × 평균스텝(~70) × 프레임 ≈ 초당 거리함수 호출 수
    raysEl.textContent = (cv.width*cv.height*70*fps/1e9).toFixed(1)+'B';
    if(fps < 30 && dpr > 0.6){ dpr -= 0.25; resize(); }   // 느리면 해상도↓
    else if(fps > 55 && dpr < Math.min(devicePixelRatio,1.75)){ dpr += 0.25; resize(); }
    frames=0; last=now;
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
