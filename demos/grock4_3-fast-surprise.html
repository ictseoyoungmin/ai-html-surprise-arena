<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grok의 우주 • 놀라움</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap');
        
        body {
            font-family: 'Inter', system-ui, sans-serif;
        }
        
        .title-font {
            font-family: 'Space Grotesk', sans-serif;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
        }

        .glow {
            text-shadow: 0 0 20px rgb(59 130 246), 0 0 40px rgb(147 51 234);
        }
    </style>
</head>
<body class="bg-black text-white overflow-hidden">
    <canvas id="canvas"></canvas>
    
    <div class="relative min-h-screen flex items-center justify-center p-8">
        <div class="max-w-2xl text-center z-10">
            <!-- Header -->
            <div class="mb-12">
                <div class="inline-flex items-center gap-3 mb-6">
                    <div class="w-6 h-6 bg-blue-500 rounded-full animate-pulse"></div>
                    <span class="text-blue-400 text-sm tracking-[4px] font-mono">xAI • GROK</span>
                </div>
                <h1 class="title-font text-7xl md:text-8xl font-bold tracking-tighter glow mb-4">
                    우주를<br>이해하다
                </h1>
                <p class="text-xl text-gray-400 max-w-md mx-auto">당신의 마우스를 움직여보세요.<br>그리고 클릭하세요.</p>
            </div>

            <!-- Interactive hint -->
            <div id="hint" class="text-xs tracking-widest text-gray-500 font-mono mb-16 animate-pulse">
                MOUSE MOVE • CLICK TO EXPLODE
            </div>

            <!-- Surprise content -->
            <div id="content" class="hidden space-y-8">
                <div class="text-4xl font-light text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-purple-400 to-pink-400">
                    이 모든 것이<br>단 하나의 HTML 파일입니다
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 text-left max-w-lg mx-auto">
                    <div class="bg-white/5 backdrop-blur-lg border border-white/10 rounded-2xl p-6 hover:border-blue-500 transition-all">
                        <div class="text-blue-400 text-2xl mb-2">∞</div>
                        <div class="font-mono text-sm">PARTICLES</div>
                        <div class="text-xs text-gray-400 mt-1">실시간 5000개 입자</div>
                    </div>
                    <div class="bg-white/5 backdrop-blur-lg border border-white/10 rounded-2xl p-6 hover:border-purple-500 transition-all">
                        <div class="text-purple-400 text-2xl mb-2">⚡</div>
                        <div class="font-mono text-sm">PHYSICS</div>
                        <div class="text-xs text-gray-400 mt-1">마우스 끌어당김</div>
                    </div>
                    <div class="bg-white/5 backdrop-blur-lg border border-white/10 rounded-2xl p-6 hover:border-pink-500 transition-all">
                        <div class="text-pink-400 text-2xl mb-2">🌌</div>
                        <div class="font-mono text-sm">COSMIC</div>
                        <div class="text-xs text-gray-400 mt-1">xAI 테마</div>
                    </div>
                </div>

                <button onclick="createExplosion()" 
                        class="mt-8 px-10 py-4 bg-white text-black font-semibold rounded-2xl hover:scale-105 active:scale-95 transition-all flex items-center gap-3 mx-auto group">
                    <span>우주 폭발 보기</span>
                    <span class="group-active:rotate-12 transition-transform">✨</span>
                </button>
            </div>
        </div>
    </div>

    <footer class="fixed bottom-6 left-1/2 -translate-x-1/2 text-xs text-gray-600 font-mono flex gap-8">
        <div>단일 파일 • 0 외부 의존성 (Tailwind CDN 제외)</div>
        <div onclick="window.location.reload()" class="cursor-pointer hover:text-white transition-colors">RESTART UNIVERSE</div>
    </footer>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let mouse = { x: 0, y: 0, radius: 120 };
        let isExploded = false;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 3 + 1;
                this.speedX = Math.random() * 3 - 1.5;
                this.speedY = Math.random() * 3 - 1.5;
                this.color = color;
                this.life = 300;
                this.gravity = 0.02;
            }
            
            update() {
                this.speedY += this.gravity;
                this.x += this.speedX;
                this.y += this.speedY;
                this.life -= 1.5;
                this.size *= 0.985;
            }
            
            draw() {
                ctx.save();
                ctx.globalAlpha = this.life / 300;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                
                // Glow
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        function createParticles(x, y, count, color) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                
                // Mouse attraction
                const dx = mouse.x - particles[i].x;
                const dy = mouse.y - particles[i].y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < mouse.radius) {
                    const force = (mouse.radius - distance) / mouse.radius;
                    particles[i].speedX += dx * force * 0.04;
                    particles[i].speedY += dy * force * 0.04;
                }
                
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                    i--;
                }
            }

            // Background stars
            if (Math.random() < 0.4) {
                ctx.fillStyle = 'white';
                ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 1, 1);
            }

            requestAnimationFrame(animate);
        }

        function createExplosion() {
            if (isExploded) return;
            isExploded = true;
            
            document.getElementById('hint').classList.add('hidden');
            document.getElementById('content').classList.remove('hidden');
            
            const colors = ['#3b82f6', '#a855f7', '#ec4899', '#22d3ee'];
            
            for (let i = 0; i < 18; i++) {
                setTimeout(() => {
                    const x = canvas.width / 2 + (Math.random() - 0.5) * 400;
                    const y = canvas.height / 2 + (Math.random() - 0.5) * 300;
                    createParticles(x, y, 280, colors[Math.floor(Math.random() * colors.length)]);
                }, i * 60);
            }
            
            // Final big burst
            setTimeout(() => {
                createParticles(canvas.width/2, canvas.height/2, 1200, '#ffffff');
            }, 1200);
        }

        // Mouse tracking
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            
            // Occasional particles on move
            if (Math.random() < 0.2) {
                createParticles(e.clientX, e.clientY, 6, '#60a5fa');
            }
        });

        window.addEventListener('click', (e) => {
            if (!isExploded) {
                createExplosion();
            } else {
                createParticles(e.clientX, e.clientY, 220, '#c084fc');
            }
        });

        // Touch support
        window.addEventListener('touchmove', (e) => {
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        });

        // Init
        window.addEventListener('load', () => {
            resize();
            animate();
            
            // Initial particles
            for (let i = 0; i < 80; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                createParticles(x, y, 1, '#64748b');
            }
            
            // Auto trigger hint
            setTimeout(() => {
                if (!isExploded) {
                    createParticles(canvas.width * 0.3, canvas.height * 0.4, 40, '#60a5fa');
                }
            }, 1800);
        });

        window.addEventListener('resize', resize);
        
        // Keyboard surprise
        document.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') {
                window.location.reload();
            }
            if (e.key === ' ' && isExploded) {
                createParticles(mouse.x, mouse.y, 300, '#f472b6');
            }
        });
    </script>
</body>
</html>
