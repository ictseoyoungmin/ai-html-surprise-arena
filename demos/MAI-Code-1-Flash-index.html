<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tiny universe</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #02030a;
      --fg: #f4f7ff;
      --accent: #7dd3fc;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: radial-gradient(circle at 50% 50%, #0f172a 0, var(--bg) 45%, #000 100%);
      color: var(--fg);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      overflow: hidden;
      cursor: crosshair;
    }
    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      isolation: isolate;
    }
    .core {
      position: relative;
      width: clamp(120px, 22vw, 220px);
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.22);
      background: radial-gradient(circle, rgba(125,211,252,0.95) 0, rgba(125,211,252,0.2) 35%, transparent 70%);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.04), 0 0 80px rgba(125,211,252,0.35);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      animation: breathe 4s ease-in-out infinite;
    }
    .core::before, .core::after {
      content: "";
      position: absolute;
      inset: 10%;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.12);
      animation: spin 10s linear infinite;
    }
    .core::after { inset: 24%; animation-duration: 7s; animation-direction: reverse; }
    .core:hover {
      transform: scale(1.04);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 0 100px rgba(125,211,252,0.5);
    }
    .core.open {
      transform: scale(1.35) rotate(180deg);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.1), 0 0 140px rgba(125,211,252,0.65);
    }
    .label {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(0.8rem, 1.6vw, 1rem);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0.74;
      text-align: center;
      white-space: nowrap;
    }
    .message {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .message.show {
      opacity: 1;
    }
    .message span {
      font-size: clamp(1.2rem, 3.6vw, 2rem);
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-shadow: 0 0 24px rgba(125,211,252,0.7);
      transform: translateY(12px);
      animation: rise 0.8s ease forwards;
    }
    .star {
      position: fixed;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      pointer-events: none;
      background: white;
      box-shadow: 0 0 10px currentColor;
      animation: twinkle 0.9s ease-out forwards;
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.025); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes twinkle {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0); }
    }
    @keyframes rise {
      to { transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="core" id="core"></div>
    <div class="message" id="message"><span>you made a tiny universe</span></div>
    <div class="label">model: MAI-Code-1-Flash · version: 2026-06-11</div>
  </div>

  <script>
    const core = document.getElementById('core');
    const message = document.getElementById('message');

    document.addEventListener('pointermove', (e) => {
      for (let i = 0; i < 2; i++) {
        const s = document.createElement('span');
        s.className = 'star';
        s.style.left = `${e.clientX}px`;
        s.style.top = `${e.clientY}px`;
        s.style.color = `hsl(${Math.random() * 360} 90% 75%)`;
        s.style.background = 'currentColor';
        document.body.appendChild(s);
        setTimeout(() => s.remove(), 900);
      }
    });

    core.addEventListener('click', () => {
      core.classList.toggle('open');
      message.classList.toggle('show');
      setTimeout(() => message.classList.remove('show'), 1000);
    });
  </script>
</body>
</html>
